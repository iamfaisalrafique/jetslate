name: Node 24 isolated image validation
on:
  push:
    branches: ['codex/node24-xgeuvm-20261024']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/iamfaisalrafique/jetslate:node24-24.22.1-xgeuvm
          labels: |
            org.opencontainers.image.source=https://github.com/iamfaisalrafique/jetslate
            org.opencontainers.image.revision=${{ github.sha }}
            io.coolify.node24.original-revision=bb3d2c38de4fcaa4682a9fa159a4c018bd0963c6
          cache-from: type=gha
          cache-to: type=gha,mode=max
